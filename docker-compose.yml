version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: nca_dc
      POSTGRES_USER: nca
      POSTGRES_PASSWORD: nca_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "cd backend && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgresql://nca:nca_dev_pass@db:5432/nca_dc
      DEBUG: "True"
      SECRET_KEY: dev-secret-key
      PRIVATE_UPLOAD_ROOT: /app/private_uploads
      PRIVATE_EXPORT_ROOT: /app/private_exports
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - private_uploads:/app/private_uploads
      - private_exports:/app/private_exports
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    # Next.js proxies browser requests from /api/* to Django. Inside the
    # frontend container Django is reachable by its Compose service name,
    # not by localhost (which points back to the frontend container).
    command: sh -c "DJANGO_INTERNAL_URL=http://backend:8000 pnpm dev --port 3000"
    ports:
      - "3001:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "cd backend && celery -A config worker --loglevel=info"
    environment:
      DATABASE_URL: postgresql://nca:nca_dev_pass@db:5432/nca_dc
      DEBUG: "True"
      SECRET_KEY: dev-secret-key
      CELERY_BROKER_URL: redis://redis:6379/0
      PRIVATE_UPLOAD_ROOT: /app/private_uploads
      PRIVATE_EXPORT_ROOT: /app/private_exports
    volumes:
      - private_uploads:/app/private_uploads
      - private_exports:/app/private_exports
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  private_uploads:
  private_exports:
