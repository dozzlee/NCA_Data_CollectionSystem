version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nca_dc
      POSTGRES_USER: nca
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nca -d nca_dc"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py loaddata fixtures/ghana_regions.json &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - static_files:/app/staticfiles
      - private_exports:/app/private_exports
      - private_uploads:/app/private_uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://nca:${DB_PASSWORD}@db:5432/nca_dc
      - DEBUG=False
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PRIVATE_EXPORT_ROOT=/app/private_exports
      - PRIVATE_UPLOAD_ROOT=/app/private_uploads
      - MALWARE_SCANNER_REQUIRED=True
      - CLAMAV_HOST=clamav
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      clamav:
        condition: service_started
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  clamav:
    image: clamav/clamav:1.4
    restart: always

  pgbackrest:
    image: pgbackrest/pgbackrest:2.53
    profiles: ["recovery"]
    volumes:
      - ./operations/pgbackrest.conf.example:/etc/pgbackrest/pgbackrest.conf:ro
      - postgres_data:/var/lib/postgresql/data:ro
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker --loglevel=info
    volumes:
      - private_exports:/app/private_exports
      - private_uploads:/app/private_uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://nca:${DB_PASSWORD}@db:5432/nca_dc
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PRIVATE_EXPORT_ROOT=/app/private_exports
      - PRIVATE_UPLOAD_ROOT=/app/private_uploads
      - MALWARE_SCANNER_REQUIRED=True
      - CLAMAV_HOST=clamav
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      clamav:
        condition: service_started
    restart: always

  beat:
    build: ./backend
    command: celery -A config beat --loglevel=info
    volumes:
      - private_exports:/app/private_exports
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://nca:${DB_PASSWORD}@db:5432/nca_dc
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PRIVATE_EXPORT_ROOT=/app/private_exports
    depends_on:
      - redis
      - worker
    restart: always

  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        DJANGO_INTERNAL_URL: http://backend:8000
    environment:
      - NODE_ENV=production
      - DJANGO_INTERNAL_URL=http://backend:8000
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data:
  static_files:
  private_exports:
  private_uploads:
